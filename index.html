<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datascape</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: black;
    font-family: Arial, sans-serif;
}

#starWall,
#dataWall,
#transitionCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

#transitionCanvas {
    z-index: 100;
    pointer-events: none;
    display: none;
}

#starWall,
#dataWall {
    transition: opacity 3s linear;
}

/* STAR WALL */

.star-field {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
}

.constellation {
    position: absolute;
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    white-space: nowrap;
    transform: translateY(-50%);
}

.constellation-bracket {
    position: absolute;
    color: rgba(100,150,255,0.7);
    font-size: 18px;
    transform: translateY(-50%);
}

/* DATA WALL */

#matrix {
    position: absolute;
    inset: 0;
}

.line {
    position: absolute;
    width: 100%;
    white-space: nowrap;
    color: white;
    font-family: monospace;
    font-size: 16px;
    line-height: 20px;
}
</style>
</head>

<body>

<div id="starWall"></div>

<div id="dataWall" style="display:none;">
    <div id="matrix"></div>
</div>

<canvas id="transitionCanvas"></canvas>

<script>
(() => {

const DISPLAY_TIME = 30000;

const starWall = document.getElementById('starWall');
const dataWall = document.getElementById('dataWall');

const canvas = document.getElementById('transitionCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);
resize();

/* =========================================================
   STAR WALL
========================================================= */

const starNames = [
    "Sirius","Canopus","Arcturus","Vega","Rigel",
    "Betelgeuse","Altair","Aldebaran","Antares",
    "Spica","Pollux","Deneb","Regulus","Bellatrix","Polaris"
];

for(let layer = 0; layer < 8; layer++) {

    const field = document.createElement('div');
    field.className = 'star-field';

    starWall.appendChild(field);

    const objects = [];

    for(let i = 0; i < 100; i++) {

        const star = document.createElement('div');
        star.className = 'star';

        const size = Math.max(1, 3 - layer * 0.25);

        star.style.width = size + 'px';
        star.style.height = size + 'px';

        const x = Math.random() * 100;
        const y = Math.random() * 100;

        star.style.left = x + '%';
        star.style.top = y + '%';
        star.style.opacity = 1 - layer * 0.08;

        field.appendChild(star);
        objects.push(star);

        if(layer === 0 && Math.random() < 0.05) {

            const name =
                starNames[
                    Math.floor(Math.random() * starNames.length)
                ];

            const lb = document.createElement('div');
            lb.className = 'constellation-bracket';
            lb.textContent = '[';
            lb.style.left = (x - 2) + '%';
            lb.style.top = y + '%';

            const rb = document.createElement('div');
            rb.className = 'constellation-bracket';
            rb.textContent = ']';
            rb.style.left = (x + 2) + '%';
            rb.style.top = y + '%';

            const label = document.createElement('div');
            label.className = 'constellation';
            label.textContent = name;
            label.style.left = (x + 4) + '%';
            label.style.top = y + '%';

            field.appendChild(lb);
            field.appendChild(rb);
            field.appendChild(label);

            objects.push(lb, rb, label);
        }
    }

    const speed = 0.02 + layer * 0.02;
    const dir = layer % 2 === 0 ? -1 : 1;

    function animateStars() {

        objects.forEach(obj => {

            let x = parseFloat(obj.style.left);

            x += speed * dir;

            if(x > 100) x = 0;
            if(x < 0) x = 100;

            obj.style.left = x + '%';
        });

        requestAnimationFrame(animateStars);
    }

    animateStars();
}

/* =========================================================
   DATA WALL
========================================================= */

const matrix = document.getElementById('matrix');
const lines = [];

function createLine(y) {

    const div = document.createElement('div');

    div.className = 'line';
    div.style.top = y + 'px';

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789█▓▒░ ";

    let str = '';

    for(let i = 0; i < 400; i++) {

        str += chars[
            Math.floor(Math.random() * chars.length)
        ];
    }

    div.textContent = str;

    div.x = 0;
    div.speed = 50 + Math.random() * 150;

    matrix.appendChild(div);

    return div;
}

for(let y = 0; y < window.innerHeight; y += 20) {
    lines.push(createLine(y));
}

let lastTime = performance.now();

function animateMatrix(now) {

    const delta = (now - lastTime) / 1000;
    lastTime = now;

    lines.forEach(line => {

        line.x -= line.speed * delta;

        if(line.x < -2000) {
            line.x = 0;
        }

        line.style.left = line.x + 'px';
    });

    requestAnimationFrame(animateMatrix);
}

requestAnimationFrame(animateMatrix);

/* =========================================================
   STATIC PLASMA GENERATOR
========================================================= */

const plasmaCanvas = document.createElement('canvas');
const plasmaCtx = plasmaCanvas.getContext('2d');

function hsvToRgb(h, s, v) {

    let f = (n, k = (n + h / 60) % 6) =>
        v - v * s * Math.max(
            Math.min(k, 4 - k, 1),
            0
        );

    return {
        r: Math.floor(f(5) * 255),
        g: Math.floor(f(3) * 255),
        b: Math.floor(f(1) * 255)
    };
}

function generateStaticPlasma() {

    plasmaCanvas.width = canvas.width;
    plasmaCanvas.height = canvas.height;

    const img =
        plasmaCtx.createImageData(
            plasmaCanvas.width,
            plasmaCanvas.height
        );

    const data = img.data;

    const time = Math.random() * 1000;

    const freq1 = 4 + Math.random() * 8;
    const freq2 = 4 + Math.random() * 8;
    const freq3 = 10 + Math.random() * 20;

    const hueShift =
        Math.random() * 360;

    for(let y = 0; y < plasmaCanvas.height; y++) {

        for(let x = 0; x < plasmaCanvas.width; x++) {

            const nx =
                x / plasmaCanvas.width;

            const ny =
                y / plasmaCanvas.height;

            const v1 =
                Math.sin(
                    nx * freq1 + time
                );

            const v2 =
                Math.sin(
                    ny * freq2 + time * 0.7
                );

            const dx = nx - 0.5;
            const dy = ny - 0.5;

            const dist =
                Math.sqrt(dx*dx + dy*dy);

            const v3 =
                Math.sin(
                    dist * freq3 - time * 2
                );

            const plasma =
                (v1 + v2 + v3) / 3;

            const hue =
                hueShift +
                plasma * 180 +
                Math.sin(nx * 10) * 40;

            const sat =
                0.8 + plasma * 0.2;

            const val =
                0.6 + plasma * 0.35;

            const c =
                hsvToRgb(
                    hue,
                    sat,
                    val
                );

            const idx =
                (y * plasmaCanvas.width + x) * 4;

            data[idx] = c.r;
            data[idx + 1] = c.g;
            data[idx + 2] = c.b;
            data[idx + 3] = 255;
        }
    }

    plasmaCtx.putImageData(img, 0, 0);
}

/* =========================================================
   TRANSITION
========================================================= */

function clearBlack() {

    ctx.fillStyle = 'black';

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

function animate(duration, draw) {

    return new Promise(resolve => {

        const start = performance.now();

        function frame(now) {

            const p =
                Math.min(
                    1,
                    (now - start) / duration
                );

            draw(p);

            if(p < 1) {
                requestAnimationFrame(frame);
            }
            else {
                resolve();
            }
        }

        requestAnimationFrame(frame);
    });
}

async function plasmaTransition() {

    generateStaticPlasma();

    canvas.style.display = 'block';

    const centerY =
        canvas.height / 2;

    /* =====================================
       STAGE 1
       Horizontal Sweep
    ===================================== */

    await animate(4000, p => {

        clearBlack();

        ctx.save();

        ctx.beginPath();

        ctx.rect(
            0,
            centerY - 2,
            canvas.width * p,
            4
        );

        ctx.clip();

        ctx.drawImage(plasmaCanvas, 0, 0);

        ctx.restore();
    });

    /* =====================================
       STAGE 2
       Vertical Expansion
    ===================================== */

    await animate(12000, p => {

        clearBlack();

        const reveal =
            centerY * p;

        ctx.save();

        ctx.beginPath();

        ctx.rect(
            0,
            centerY - reveal,
            canvas.width,
            reveal * 2
        );

        ctx.clip();

        ctx.drawImage(plasmaCanvas, 0, 0);

        ctx.restore();
    });

    /* =====================================
       STAGE 3
       Fade Out
    ===================================== */

    await animate(2000, p => {

        clearBlack();

        ctx.globalAlpha = 1 - p;

        ctx.drawImage(
            plasmaCanvas,
            0,
            0
        );

        ctx.globalAlpha = 1;
    });

    clearBlack();

    canvas.style.display = 'none';
}

/* =========================================================
   DISPLAY CYCLER
========================================================= */

const displays = [starWall, dataWall];

let current = 0;

function showDisplay(index) {

    displays.forEach(d => {
        d.style.display = 'none';
    });

    displays[index].style.display = 'block';
    displays[index].style.opacity = 1;
}

function wait(ms) {
    return new Promise(r => setTimeout(r, ms));
}

async function cycle() {

    while(true) {

        showDisplay(current);

        await wait(DISPLAY_TIME - 3000);

        displays[current].style.opacity = 0;

        await wait(3000);

        await plasmaTransition();

        current =
            (current + 1) % displays.length;
    }
}

cycle();

})();
</script>

</body>
</html>
